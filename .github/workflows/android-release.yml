name: Build & Release K2pdfopt Android APKs

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3 for Translation CI Check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify All 18 UI Translations, Plurals, and Placeholders
        run: python3 scripts/verify_translations.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK, NDK r27c (16 KB ELF Page Alignment), and CMake 3.22.1
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch & Patch Upstream k2pdfopt v2.55 + MuPDF + Leptonica + Tesseract 5 + DjVuLibre + HarfBuzz
        run: |
          chmod +x scripts/fetch_and_patch_k2pdfopt.sh
          ./scripts/fetch_and_patch_k2pdfopt.sh

      - name: Run Unit & Robolectric Verification Suite
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Signed Universal & Per-ABI Release APKs (arm64-v8a, armeabi-v7a, x86_64)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          ./gradlew :app:assembleRelease -PenableNativeBuild=true

      - name: Verify 16 KB ELF Segment Alignment on libk2pdfopt.so
        run: |
          find app/build/intermediates/stripped_native_libs -name "libk2pdfopt.so" -exec llvm-readelf -l {} + || true

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: k2pdfopt-android-release-apks
          path: app/build/outputs/apk/release/*.apk
